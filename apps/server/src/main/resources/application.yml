server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: meet-server

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/meet_platform}
    username: ${DATABASE_USERNAME:meet_user}
    password: ${DATABASE_PASSWORD:changeme}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  websocket:
    heartbeat-interval-seconds: ${WS_HEARTBEAT_INTERVAL_SECONDS:10}
    heartbeat-timeout-seconds: ${WS_HEARTBEAT_TIMEOUT_SECONDS:30}
    reconnect-grace-seconds: ${WS_RECONNECT_GRACE_SECONDS:15}
  turn:
    host: ${TURN_HOST:}
    port: ${TURN_PORT:3478}
    secret: ${TURN_SECRET:}
    credential-ttl-seconds: ${TURN_CREDENTIAL_TTL_SECONDS:3600}
    stun-url: ${STUN_URL:stun:stun.l.google.com:19302}
  livekit:
    url: ${LIVEKIT_URL:}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
  livestream:
    ffmpeg-path: ${LIVESTREAM_FFMPEG_PATH:ffmpeg}
    output-dir: ${LIVESTREAM_OUTPUT_DIR:./livestream-output}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
        allowed-methods: GET
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.project.meet: DEBUG
