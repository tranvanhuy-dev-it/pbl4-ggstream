spring:
  datasource:
    url: jdbc:h2:mem:meet_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: test-only-secret-not-for-production-use-1234567890
    expiration-minutes: 60
  websocket:
    heartbeat-interval-seconds: 1
    heartbeat-timeout-seconds: 4
    heartbeat-check-interval-ms: 300
    reconnect-grace-seconds: 1
  turn:
    host: turn.test.invalid
    port: 3478
    secret: test-turn-shared-secret
    credential-ttl-seconds: 3600
    stun-url: stun:stun.l.google.com:19302
  livekit:
    url: ws://localhost:7880
    api-key: test-livekit-key
    api-secret: test-livekit-secret-not-for-production
  livestream:
    ffmpeg-path: ffmpeg
    output-dir: ./target/test-livestream-output

# NOTE: this file fully replaces src/main/resources/application.yml on the
# test classpath (Spring Boot loads the first "application.yml" it finds —
# main and test resources are not merged), so anything from the main config
# that a test depends on (e.g. actuator CORS, below) must be duplicated here.
management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: http://localhost:3000
        allowed-methods: GET
